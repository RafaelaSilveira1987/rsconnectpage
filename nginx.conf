
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Normaliza o endereco publico
    location = /rsconnectsystem {
        return 301 /rsconnectsystem/;
    }

    # Arquivos da landing page quando o proxy preserva o prefixo
    location ^~ /rsconnectsystem/assets/ {
        rewrite ^/rsconnectsystem/(.*)$ /$1 break;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Landing page no subdiretorio
    location ^~ /rsconnectsystem/ {
        rewrite ^/rsconnectsystem/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Mantem o endereco provisório do EasyPanel funcional
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2|webm|mp4)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
